<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Checkout</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="wrap"><p class="eyebrow">Asset Checkout</p><h1>Keep track of shared equipment.</h1><p>A simple equipment borrowing ledger for small teams.</p></div></header><main class="wrap"><section class="panel"><h2>Add equipment</h2><form id="add-form"><label>Asset ID<input name="id" required maxlength="50" placeholder="LAP-001"></label><label>Equipment name<input name="name" required maxlength="100" placeholder="Laptop"></label><button>Add asset</button></form></section><section class="panel"><h2>Equipment register</h2><label>Search<input id="search" type="search" placeholder="ID, name or borrower"></label><p id="status" role="status" aria-live="polite"></p><div id="list"></div></section><p class="note">Demonstration only. Records stay in this browser, not on a shared server.</p></main><script type="module" src="app.js"></script></body></html>
